<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>dave</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111318" />
    <!-- The first frame, before the stylesheet or any script (client/boot.ts): the app's dark, and the logo where the
         phone's splash (manifest.webmanifest, the same dark) had it. The app fades it out. -->
    <style>
      html, body { background: #111318; margin: 0; height: 100%; color-scheme: dark; }
      #boot { position: fixed; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; background: #111318; transition: opacity .3s ease-out; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot img { width: 128px; height: 128px; animation: boot-breathe 1.8s ease-in-out infinite; }
      @keyframes boot-breathe { 50% { transform: scale(.94); opacity: .85; } }
      @media (prefers-reduced-motion: reduce) { #boot { transition: none; } #boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><img src="/icon-192.png" alt="" /></div>
    <div id="app"></div>
    <script type="module" src="/src/client/index.tsx"></script>
  </body>
</html>
