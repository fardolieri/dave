name: e2e
# The browser suite (e2e/, playwright.config.ts) in Chromium and Firefox, the only browser tests this repo has:
#   - every pushed branch except master and prod: against a local build (Worker and Room in workerd, inspection hooks on),
#     unless the branch's PR is a draft (draft-gate.yml)
#   - after each successful master deploy: against nightly, which master builds with the same hooks
#   - by hand from the Actions tab: local, nightly, or any deployed URL
#   - called by preview.yml after each pull request preview deploy: against that preview, which is built like nightly
# Each engine is split into shards on runners of their own (Playwright's --shard): the whole suite on one runner took
# about 7 minutes. Eight per engine: 16 jobs stay under the 20 a free account runs at once, and beyond that each runner's
# ~40 s of setup outweighs its share of the tests. A runner has its own IP, so nightly's upgrade limit sees one shard.
# The report and the traces of failures are kept as an artifact.
#
# The nightly run is the release gate: its last job writes the commit status `nightly e2e passed`, success only when every
# shard of both engines passed against nightly for that exact commit, with no flaky test (playwright.config.ts fails flakes
# there). A ruleset on `prod` requires it, so GitHub refuses to fast-forward prod to a commit that has not passed (CLAUDE.md).
# A flake turns it red on purpose, so whoever releases sees it; they may re-run the failed jobs once after clearing the
# commits going out (/release step 2a), and the re-run's verdict replaces the first. Each attempt keeps its artifacts.
on:
  push:
    branches-ignore: [master, prod, flake-ledger] # flake-ledger: data only (flakes.yml)
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: "local, nightly, or the URL of a deployed copy"
        default: local
        required: true
      grep:
        description: "only the tests whose title matches (Playwright's -g), e.g. to check a flake"
        default: ""
      repeat:
        description: "runs of each test (--repeat-each), spread over the shards"
        default: "1"
  workflow_call:
    inputs:
      target:
        description: "the URL of a deployed copy"
        type: string
        required: true
      ref:
        description: "the commit deployed there"
        type: string
        required: true
concurrency:
  # When called, the caller's event and ref apply: preview.yml's concurrency already cancels a superseded preview run.
  group: e2e-${{ github.event_name == 'workflow_run' && 'nightly' || github.event_name == 'pull_request' && format('preview-{0}', github.ref) || github.ref }}
  cancel-in-progress: true
jobs:
  draft:
    uses: ./.github/workflows/draft-gate.yml
    permissions:
      contents: read
      pull-requests: read
  e2e:
    needs: draft
    # After a deploy, only when it succeeded; a failed deploy leaves nightly on the previous version.
    if: needs.draft.outputs.run == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox]
        shard: [1, 2, 3, 4, 5, 6, 7, 8] # the total is written out again in the test step below
    env:
      # Empty means a local build; `nightly` is a shorthand the config understands.
      E2E_URL: ${{ github.event_name == 'workflow_run' && 'nightly' || (inputs.target != 'local' && inputs.target || '') }}
    steps:
      - uses: actions/checkout@v5
        with:
          # After a deploy, test the commit that was deployed.
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both engines in both jobs: a few tests put a Chromium sharer in front of a Firefox viewer or mix engines in one call.
      - name: Browsers
        timeout-minutes: 25
        run: |
          # The runner's apt mirror sometimes hangs for good (2026-10-09: 45 min, the job's whole budget, on the first
          # `apt-get update`). A hang is cut short and retried; a test never is.
          # `timeout` stops playwright but not the apt-get it started with sudo, which kept the dpkg lock and failed
          # every later attempt at once (2026-10-09). That apt-get is stopped before the next attempt, a dpkg it left
          # finishes on its own, and apt waits up to 2 min for the lock instead of failing.
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 7m pnpm exec playwright install --with-deps chromium firefox && exit 0
            echo "browser install attempt $i failed"
            sudo pkill -x apt-get || true; sleep 15; sudo dpkg --configure -a || true
          done; exit 1
      - run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/8 --repeat-each=${{ inputs.repeat || 1 }} ${{ inputs.grep && '-g "$E2E_GREP" --pass-with-no-tests' || '' }}
        env:
          E2E_GREP: ${{ inputs.grep }}
      # For the flake ledger (flakes.yml): one line per test that failed a try, and one for the shard, whatever the result.
      - name: Outcomes
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
          REF: ${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          GREP: ${{ inputs.grep }}
          REPEAT: ${{ inputs.repeat }}
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
        run: node scripts/flakes/ledger.mjs outcomes e2e-outcomes/report.json > outcomes.jsonl || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-outcomes-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-report
            e2e-results
          retention-days: 14
      # The screenshots of every theme (e2e/themes.spec.ts), so each look can be seen from a phone without running anything.
      # Chromium only, named `theme-screenshots-chromium-<shard>` after the shard that ran the test; the others upload
      # nothing. `gh run download <run id> -p 'theme-screenshots-*'` fetches it whichever shard that was. The shard is in
      # the name because a --repeat-each run has the test on several shards at once, and two uploads of one name at the
      # same time fail one of them (409). Kept whatever the result, a failing theme most of all.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.project == 'chromium'
        with:
          name: theme-screenshots-${{ matrix.project }}-${{ matrix.shard }}
          path: e2e-themes
          if-no-files-found: ignore
          overwrite: true # a re-run of the job uploads it again
          retention-days: 14
      # A test that failed once and passed on its retry fails no job, but its failed try kept its trace and wire logs
      # (retain-on-failure): kept too, or a flake that shows once cannot be read (tickets 41, 44 and 50 had nothing).
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: e2e-flaky-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-results
          if-no-files-found: ignore
          retention-days: 14

  gate:
    # The release gate. After the run against nightly it writes the commit status `nightly e2e passed` on the tested commit,
    # success only when every shard of both engines passed. A ruleset on `prod` requires that status. It is a commit status
    # and not this job's own check because GitHub's rules do not count checks from workflow_run runs (tried 2026-10-08).
    # Branch runs of the same commit never write it.
    # Called from preview.yml it gates nothing, and is named so.
    # A push to a draft PR's branch tested nothing and reports nothing.
    name: ${{ github.event_name == 'pull_request' && 'result' || 'release gate' }}
    needs: [draft, e2e]
    if: always() && needs.draft.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
          NIGHTLY: ${{ github.event_name == 'workflow_run' }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "e2e shards: $RESULT (against nightly: $NIGHTLY)"
          # No verdict for a run that never tested this commit: its deploy failed or was replaced by a newer master push
          # (skipped). Writing "failure" there read as a broken commit (2026-10-11, f360159); the commit simply stays
          # unreleasable until a later commit passes. A cancelled run (a newer nightly run took over, or a shard hung past
          # its timeout) writes no status either, but fails this job so a hang stays visible.
          if [ "$NIGHTLY" = true ] && [ "$RESULT" = skipped ]; then echo "No verdict for $SHA: the suite did not run"; exit 0; fi
          if [ "$NIGHTLY" = true ] && [ "$RESULT" = cancelled ]; then echo "::error::No verdict for $SHA: the suite was cancelled (superseded, or a shard timed out)"; exit 1; fi
          if [ "$NIGHTLY" = true ]; then
            state=$([ "$RESULT" = success ] && echo success || echo failure)
            gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" -f state="$state" -f context="nightly e2e passed" \
              -f description="Full e2e suite against nightly, both engines, no flakes: $RESULT" -f target_url="$RUN_URL" > /dev/null
            echo "Wrote 'nightly e2e passed' = $state on $SHA"
          fi
          test "$RESULT" = success
