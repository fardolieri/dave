name: e2e
# The browser suite (e2e/, playwright.config.ts) in Chromium and Firefox, the only browser tests this repo has:
#   - called by preview.yml after each pull request preview deploy: against that preview, real Cloudflare with the same
#     hooks. This run is the gate to master.
#   - every pushed night-shift/* branch: against a local build (Worker and Room in workerd, inspection hooks on). Its red
#     run is the evidence of a draft "Repro:" PR, which gets no preview (scripts/night-shift).
#     Other branches get the suite from their pull request's preview only: on a ready PR, a run against a local build of the
#     same commit told nothing the preview run did not, and its 16 jobs queued the preview's behind them.
#   - by hand from the Actions tab: local, or any deployed URL
#   - weekly, and by hand with `solid_dev`: against a local build on Solid's development build (VITE_SOLID_DEV=1), where
#     Solid's diagnostics about correctness fail a test, so do those about how the code is put together unless e2e/fixtures.ts
#     allows one with its reason (SOLID_ALLOWED), and all of them are kept as `e2e-solid-*`. It
#     catches what the production build lets pass, such as a write Solid forbids, before the dev server or a Solid upgrade
#     trips on it. Its failures stay out of the flake ledger: they are of another build.
# Each engine is split into shards on runners of their own (Playwright's --shard): the whole suite on one runner took
# about 7 minutes. Eight per engine: 16 jobs stay under the 20 a free account runs at once, and beyond that each runner's
# ~40 s of setup outweighs its share of the tests. A runner has its own IP, so a preview's upgrade limit sees one shard.
# The report and the traces of failures are kept as an artifact.
#
# The preview run is the gate to master, and master deploys the live site: its last job writes the commit status
# `preview e2e passed` on the pull request's head, success only when every shard of both engines passed against the preview
# for that exact commit, with no flaky test (playwright.config.ts fails flakes there). A ruleset on master requires it, so
# GitHub refuses to move master to a commit that has not passed (CLAUDE.md). A flake turns it red on purpose; the failed
# jobs may be re-run once after clearing the change (CLAUDE.md, Flakes), and the re-run's verdict replaces the first. Each
# attempt keeps its artifacts.
on:
  push:
    branches: ['night-shift/**']
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC, on Solid's development build; clear of the preview sweep (04:00)
  workflow_dispatch:
    inputs:
      target:
        description: "local, or the URL of a deployed copy"
        default: local
        required: true
      grep:
        description: "only the tests whose title matches (Playwright's -g), e.g. to check a flake"
        default: ""
      repeat:
        description: "runs of each test (--repeat-each), spread over the shards"
        default: "1"
      solid_dev:
        description: "on Solid's development build, its diagnostics checked and kept (local target only)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      target:
        description: "the URL of a deployed copy"
        type: string
        required: true
      ref:
        description: "the commit deployed there"
        type: string
        required: true
concurrency:
  # When called, the caller's event and ref apply: preview.yml's concurrency already cancels a superseded preview run.
  # The weekly run on Solid's development build has its own, so a run by hand on master does not cancel it.
  group: e2e-${{ github.event_name == 'schedule' && 'solid-dev' || github.event_name == 'pull_request' && format('preview-{0}', github.ref) || github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Playwright's own image, with both engines and everything they need already in it: a few tests put a Chromium sharer
    # in front of a Firefox viewer or mix engines in one call. Installing them on the runner went through its apt mirror,
    # which hung for good (2026-10-09: 45 min on the first `apt-get update`) or crawled at 30 to 50 KB/s (2026-10-26:
    # three 7-minute tries ran out, and shards failed after 22 min without running a test).
    # The tag is @playwright/test's version; scripts/check-playwright-image.mjs (part of `pnpm test`) says when they part.
    # Root inside. --ipc=host: Chromium runs out of shared memory in Docker's default 64 MB.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox]
        shard: [1, 2, 3, 4, 5, 6, 7, 8] # the total is written out again in the test step below
    env:
      # Empty means a local build.
      E2E_URL: ${{ inputs.target != 'local' && inputs.target || '' }}
      # The local build only: a deployed copy is the production build whatever this says.
      VITE_SOLID_DEV: ${{ (github.event_name == 'schedule' || inputs.solid_dev) && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Against a preview, test the commit deployed there.
          ref: ${{ inputs.ref || github.sha }}
      # The checkout belongs to the runner's user, not root: without this git refuses it, and the build stamps no commit.
      # System-wide, as the steps do not all share one HOME.
      - run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nothing to do when the image matches the checked-out Playwright, which it need not: this file can be newer than
      # the commit tested. A preview (preview.yml) runs the copy merged with master on the pull request's head, and a
      # run by hand on an older commit runs this copy too. The browsers of the other
      # version then come from Playwright's own servers, not the apt mirror; the image's system packages fit them closely.
      - run: pnpm exec playwright install chromium firefox
      # After a deploy, the edge serves the new page and its files together only a minute or so later: a page opened before
      # that loads a file that is not there (ticket 64). Each shard waits on its own, since each runner may reach another edge.
      # A pull request not yet rebased onto the script has none at its head, and runs as before.
      - if: inputs.ref
        run: test ! -f scripts/wait-for-deploy.mjs || node scripts/wait-for-deploy.mjs "${{ inputs.ref }}"
      # HOME=/root: Firefox refuses to start as root in another user's home (the runner's, /github/home). Inside the command
      # only: set as `env:` it also reaches the runner's own docker commands, which then cannot read root's docker config.
      - run: HOME=/root pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/8 --repeat-each=${{ inputs.repeat || 1 }} ${{ inputs.grep && '-g "$E2E_GREP" --pass-with-no-tests' || '' }}
        env:
          E2E_GREP: ${{ inputs.grep }}
      # For the flake ledger (flakes.yml): one line per test that failed a try, and one for the shard, whatever the result.
      - name: Outcomes
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ inputs.ref || github.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          GREP: ${{ inputs.grep }}
          REPEAT: ${{ inputs.repeat }}
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
        run: node scripts/flakes/ledger.mjs outcomes e2e-outcomes/report.json > outcomes.jsonl || true
      - uses: actions/upload-artifact@v4
        if: always() && env.VITE_SOLID_DEV != '1'
        with:
          name: e2e-outcomes-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 3
      # On Solid's development build: what Solid said in each test, a file per test and try (e2e/fixtures.ts).
      - uses: actions/upload-artifact@v4
        if: always() && env.VITE_SOLID_DEV == '1'
        with:
          name: e2e-solid-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-solid
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-report
            e2e-results
          retention-days: 14
      # The screenshots of every theme (e2e/themes.spec.ts), so each look can be seen from a phone without running anything.
      # Chromium only, named `theme-screenshots-chromium-<shard>` after the shard that ran the test; the others upload
      # nothing. `gh run download <run id> -p 'theme-screenshots-*'` fetches it whichever shard that was. The shard is in
      # the name because a --repeat-each run has the test on several shards at once, and two uploads of one name at the
      # same time fail one of them (409). Kept whatever the result, a failing theme most of all.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.project == 'chromium'
        with:
          name: theme-screenshots-${{ matrix.project }}-${{ matrix.shard }}
          path: e2e-themes
          if-no-files-found: ignore
          overwrite: true # a re-run of the job uploads it again
          retention-days: 14
      # A test that failed once and passed on its retry fails no job, but its failed try kept its trace and wire logs
      # (retain-on-failure): kept too, or a flake that shows once cannot be read (tickets 41, 44 and 50 had nothing).
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: e2e-flaky-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-results
          if-no-files-found: ignore
          retention-days: 14

  gate:
    # The gate to master. Called from preview.yml it writes the commit status `preview e2e passed` on the pull request's
    # head, the commit tested (inputs.ref), success only when every shard of both engines passed against the preview. A
    # ruleset on master requires that status. A commit status, not this job's own check: a check belongs to the run's
    # commit, and the status must name the commit that was tested and would be pushed to master.
    # Branch runs against a local build and runs by hand never write it.
    name: ${{ github.event_name == 'pull_request' && 'gate to master' || 'result' }}
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
          GATE: ${{ github.event_name == 'pull_request' && inputs.ref != '' }}
          SHA: ${{ inputs.ref || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "e2e shards: $RESULT (the gate to master: $GATE)"
          # A cancelled run (a newer push to the PR took over, or a shard hung past its timeout) is no verdict on the commit
          # and writes no status, but fails this job so a hang stays visible. The commit simply cannot go to master.
          if [ "$GATE" = true ] && [ "$RESULT" = cancelled ]; then echo "::error::No verdict for $SHA: the suite was cancelled (superseded, or a shard timed out)"; exit 1; fi
          if [ "$GATE" = true ]; then
            state=$([ "$RESULT" = success ] && echo success || echo failure)
            gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" -f state="$state" -f context="preview e2e passed" \
              -f description="Full e2e suite against the PR's preview, both engines, no flakes: $RESULT" -f target_url="$RUN_URL" > /dev/null
            echo "Wrote 'preview e2e passed' = $state on $SHA"
          fi
          test "$RESULT" = success
