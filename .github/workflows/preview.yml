name: preview
# A preview of every open pull request, deployed so it can be tried from a phone in one tap: a Worker of its own,
# dave-pr-<number>, built like the live site but with the inspection hooks (CLOUDFLARE_ENV=preview) and redeployed on
# every push.
# One comment on the PR carries the link and is rewritten in place. The Worker is deleted by preview-sweep.yml once the
# day (UTC) its PR closed on has ended, not when it closes: deleted, its rooms leave Cloudflare's analytics with what they
# used that day, which Cloudflare still counts against the day's limits (core/relayusage.ts).
# The link is an invite to a room of the PR's own (the bare URL shows only the invite notice), the same on every push, so
# a friend tapping it lands where the PR is being tried. Its secret is public (so is the repo), which is fine for a
# throwaway Worker; any other invite link works there too with the host swapped (a room is only its secret, ADR 0004).
# The browser suite runs when someone starts it, not on every push: `gh workflow run preview.yml --ref <branch> -f
# pr=<number>`, once the PR is meant to land (AGENTS.md, Shipping): the branch's own workflows, as a push runs them. It is the gate to master, which deploys the live site: it writes the
# `preview e2e passed` status a ruleset on master requires, on the PR's head as it was when the run started. A run costs
# some 7,000 requests to Durable Objects of the previews' share of the day (core/relayusage.ts, SIDE_SHARES, RUN_COST),
# 18 runners for a quarter of an hour, and every push ran it: on 2026-11-18 the previews' share was used up by 01:20 UTC
# (ticket 89). So the run first asks Cloudflare whether the share has room for it (scripts/gate-mode.mjs):
#   - room: against the preview (e2e.yml, called), real Cloudflare, flakes failing it, and the tests a deployed copy
#     cannot run (@local) against a local build of the PR;
#   - none: the whole suite against a local build of the PR on GitHub's runners, both engines, which uses none of the
#     share. Its status says so: what only real Cloudflare shows is then first seen on the live site (rollback.yml).
# `-f mode=preview` or `-f mode=local` overrides the choice. A newer push to the PR, or closing it, cancels a gate under
# way: it tested a head that is no longer the PR's. The PR's concurrency group is its deploy's, its suite's and its
# cleanup's, not the run's: a gate started right after a push was cancelled by that push's own run, which GitHub started
# three seconds later (2026-11-18, #162, run 44273199951). So a gate's first job, outside the group, waits until the
# push's run for the head it tests has finished, and checks that the head is still the PR's.
# Every push deploys the preview, for the link, ready or draft. A draft PR's branch pushes skip ci and red-green
# (draft-gate.yml); marking it ready dispatches those two on its head. The night shift's draft "Repro:" PRs
# (night-shift/*) need no preview and get none until marked ready, which keeps the account far from its 100 Workers. PRs
# from forks are skipped: no secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: "the pull request's number"
        required: true
      mode:
        description: "auto: the preview while the previews' share has room, else a local build; or preview, or local"
        type: choice
        options: [auto, preview, local]
        default: auto
permissions:
  contents: read
  pull-requests: write
env:
  WORKER: dave-pr-${{ github.event.pull_request.number || inputs.pr }}
jobs:
  # The pull request this run is for, from its event or, started by hand, from GitHub; and where the suite goes.
  pr:
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
      deploy: ${{ steps.pr.outputs.deploy }}
      mode: ${{ steps.mode.outputs.mode }}
      short: ${{ steps.mode.outputs.short }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          # The fields read below, one by one, not the whole event: a long PR body could pass the size of a variable.
          EV_NUMBER: ${{ github.event.pull_request.number }}
          EV_STATE: ${{ github.event.pull_request.state }}
          EV_DRAFT: ${{ github.event.pull_request.draft }}
          EV_SHA: ${{ github.event.pull_request.head.sha }}
          EV_REF: ${{ github.event.pull_request.head.ref }}
          EV_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          INPUT_PR: ${{ inputs.pr }}
        shell: bash
        run: |
          # As written in the Worker's name and the concurrency group: a number, nothing else.
          if [ -n "$INPUT_PR" ] && ! [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]]; then echo "::error::pr must be a PR's number, not '$INPUT_PR'"; exit 1; fi
          if [ -n "$INPUT_PR" ]; then pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")
          else pr=$(jq -n --arg n "$EV_NUMBER" --arg state "$EV_STATE" --arg draft "$EV_DRAFT" --arg sha "$EV_SHA" --arg ref "$EV_REF" --arg repo "$EV_REPO" \
            '{number: ($n | tonumber), state: $state, draft: ($draft == "true"), head: {sha: $sha, ref: $ref, repo: {full_name: $repo}}}'); fi
          jq -e '.state == "open"' <<<"$pr" >/dev/null || { echo "::error::PR ${INPUT_PR} is not open"; exit 1; }
          if [ -n "$INPUT_PR" ]; then
            # The gate lets a commit go to master: a draft's pushes skipped ci and red-green (draft-gate.yml), which marking
            # it ready runs, and a fork's code would run with the token that writes the gate's status.
            jq -e '.draft | not' <<<"$pr" >/dev/null || { echo "::error::PR $INPUT_PR is a draft: mark it ready first (gh pr ready $INPUT_PR), which runs ci and red-green on its head"; exit 1; }
            jq -e --arg repo "$GITHUB_REPOSITORY" '.head.repo.full_name == $repo' <<<"$pr" >/dev/null || { echo "::error::PR $INPUT_PR is from a fork: no gate runs its code"; exit 1; }
          fi
          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .head.sha <<<"$pr")" >> "$GITHUB_OUTPUT"
          # A fork's gets no preview: its code would run with the secrets. A night-shift draft needs none. Marking a PR ready
          # deploys nothing new, its head deployed by its last push, but for a night-shift branch, whose drafts got none.
          echo "deploy=$(jq -r --arg repo "$GITHUB_REPOSITORY" --arg action "${{ github.event.action }}" '.head.repo.full_name == $repo and ((.draft and (.head.ref | startswith("night-shift/"))) | not) and ($action != "ready_for_review" or (.head.ref | startswith("night-shift/")))' <<<"$pr")" >> "$GITHUB_OUTPUT"
      # Started by hand: the push's own run for this head first (see the top), and the head still the PR's after it.
      - if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        shell: bash
        run: |
          for i in $(seq 1 60); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow preview.yml --event pull_request --commit "$SHA" --json status \
              --jq 'if length == 0 then "none" elif all(.[]; .status == "completed") then "done" else "under way" end')
            [ "$runs" = done ] && break
            # A head pushed before this workflow, or whose run is long gone from the list: none is coming after a minute.
            [ "$runs" = none ] && [ "$i" -gt 6 ] && break
            echo "the push's run for $SHA: $runs"; sleep 10
          done
          now=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          [ "$now" = "$SHA" ] || { echo "::error::PR $PR moved on to $now meanwhile: start the gate again for it"; exit 1; }
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Node runs the script as it is, core/relayusage.ts with its types taken off: nothing to install (quota-watch.yml).
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - id: mode
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/gate-mode.mjs
        env:
          MODE: ${{ inputs.mode }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELAY_USAGE_API_TOKEN: ${{ secrets.RELAY_USAGE_API_TOKEN }}
  deploy:
    needs: pr
    # On every push, and started by hand for the suite against the preview, which then tests the head it deployed. Not for
    # one against a local build: the push's run, which the gate waited for, deployed the head already, and a deploy beside
    # the local suite, in the same group, would cancel it.
    if: needs.pr.outputs.deploy == 'true' && (github.event_name != 'workflow_dispatch' || needs.pr.outputs.mode == 'preview')
    # The PR's preview and suite, one at a time (no run-wide group, see the top): a newer push's deploy, a gate's, or the
    # PR's closing cancels what is under way here.
    concurrency:
      group: preview-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      CLOUDFLARE_ENV: preview
      VITE_E2E: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch's commit, not GitHub's merge commit, so About names a commit that exists on the branch.
          ref: ${{ needs.pr.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The Vite plugin writes the deploy config (named dave-preview) and points .wrangler/deploy/config.json at it.
      - name: Name the Worker after the PR
        run: |
          config=$(node -e 'const p=require("path"),r=".wrangler/deploy/config.json";console.log(p.resolve(p.dirname(r),require(p.resolve(r)).configPath))')
          node -e 'const fs=require("fs"),[f,n]=process.argv.slice(1),c=JSON.parse(fs.readFileSync(f));c.name=n;fs.writeFileSync(f,JSON.stringify(c))' "$config" "$WORKER"
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # wrangler-action's `secrets:` runs `wrangler secret bulk`, which took the Worker's name from wrangler.jsonc
      # (`dave-preview`), not from the renamed deploy config: no preview ever had the TURN token, and a phone behind a
      # strict NAT could neither pull a file nor call there (report of 2026-10-16, e2e/turn.spec.ts). Put it on the
      # Worker just deployed, by name.
      - name: TURN token on the preview's Worker
        run: printf '%s' "$TURN_KEY_API_TOKEN" | pnpm exec wrangler secret put TURN_KEY_API_TOKEN --name "$WORKER"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
      # The About dialog's relay usage (src/worker/relayusage.ts), the whole account's as on the live site. Without the
      # repository secret the dialog leaves the line out.
      - name: Relay usage token on the preview's Worker
        run: |
          [ -n "$RELAY_USAGE_API_TOKEN" ] || { echo "No RELAY_USAGE_API_TOKEN: the About dialog leaves the relay out."; exit 0; }
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | pnpm exec wrangler secret put CLOUDFLARE_ACCOUNT_ID --name "$WORKER"
          printf '%s' "$RELAY_USAGE_API_TOKEN" | pnpm exec wrangler secret put RELAY_USAGE_API_TOKEN --name "$WORKER"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELAY_USAGE_API_TOKEN: ${{ secrets.RELAY_USAGE_API_TOKEN }}
      - name: Link the preview on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.pr.outputs.number }}
          SHA: ${{ needs.pr.outputs.sha }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        # With pipefail: a failed read of the comment must fail the step, not post a second comment or a new room secret.
        shell: bash
        run: |
          # wrangler-action carries on without a URL it could not find; an empty target would make e2e.yml test a local build.
          test -n "$URL" || { echo "::error::the deploy printed no URL"; exit 1; }
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- preview -->")) | .id' | sed -n 1p)
          # The room's secret is made once per PR and read back from the comment after that, so the link stays the same.
          secret=
          if [ -n "$id" ]; then
            old=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body)
            secret=$(grep -oP '<!-- room \K[A-Za-z0-9_-]+(?= -->)' <<<"$old" || true)
          fi
          [ -n "$secret" ] || secret=$(openssl rand 16 | basenc --base64url | tr -d =)
          body="<!-- preview --><!-- room $secret -->
          **[Try this PR](${URL}/#${secret}/PR%20${PR})** (preview of ${SHA:0:7}, the same room on every push)"
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null; fi
  # Started by hand only: against the preview just deployed, or, with no room in the previews' share, a local build of
  # the PR (below), which waits for no deploy.
  e2e:
    needs: [pr, deploy]
    if: github.event_name == 'workflow_dispatch' && needs.pr.outputs.mode == 'preview'
    # The PR's preview and suite, one at a time (no run-wide group, see the top): a newer push's deploy, a gate's, or the
    # PR's closing cancels what is under way here.
    concurrency:
      group: preview-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    uses: ./.github/workflows/e2e.yml
    # The called workflow's last job writes the gate's commit status, and a called job gets no more permissions than its
    # caller grants.
    permissions:
      contents: read
      statuses: write
    with:
      target: ${{ needs.deploy.outputs.url }}
      ref: ${{ needs.pr.outputs.sha }}
  e2e-local:
    needs: pr
    if: github.event_name == 'workflow_dispatch' && needs.pr.outputs.mode == 'local'
    # The PR's preview and suite, one at a time (no run-wide group, see the top): a newer push's deploy, a gate's, or the
    # PR's closing cancels what is under way here.
    concurrency:
      group: preview-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      statuses: write
    with:
      target: local
      ref: ${{ needs.pr.outputs.sha }}
      local_gate: ${{ needs.pr.outputs.short }}
  # The draft's pushes skipped the branch checks (draft-gate.yml); run them on the head now that it is ready. A night-shift
  # branch ran them on every push. The browser suite is the e2e job above.
  checks:
    if: >-
      github.event.action == 'ready_for_review' && github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'night-shift/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: for w in ci.yml red-green.yml; do gh workflow run "$w" --repo "$GITHUB_REPOSITORY" --ref "$REF"; done
  # Closing ends a gate's suite, should one be under way (the concurrency group). The Worker stays until the day ends:
  # preview-sweep.yml deletes it after midnight UTC.
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    # The PR's preview and suite, one at a time (no run-wide group, see the top): a newer push's deploy, a gate's, or the
    # PR's closing cancels what is under way here.
    concurrency:
      group: preview-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      # The room marker stays, so a reopened PR gets its old room link back.
      - name: Mark the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- preview -->")) | .id' | head -1)
          [ -n "$id" ] || exit 0
          room=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body | grep -o '<!-- room [A-Za-z0-9_-]* -->' || true)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="<!-- preview -->$room
          This PR is closed: its preview is deleted after midnight UTC." >/dev/null
