name: receipts
# Video receipts: a pull request that changes the client gets one comment with GIFs of the app, filmed here at a phone and
# a desktop viewport, before (master) and after (the PR), so the change can be seen from a phone in one tap.
#   - film: the tests tagged @receipt (playwright.receipts.config.ts; the tour in e2e/receipts/ is one) against a local
#     build of the PR, and the same tests against a build of master: the "before" checks out master's app with the PR's e2e/
#   - publish: GIFs onto the `receipts` branch under pr-<n>/<sha>/ (scripts/receipts-publish.sh), then the comment is
#     written or rewritten in place (scripts/receipts-comment.mjs)
#   - cleanup: a closed PR's folder leaves the branch. The paths filter applies to `closed` too, so every publish also
#     drops the folders of PRs that are no longer open (scripts/receipts-publish.sh)
# By hand from the Actions tab for any open PR of this repository. PRs from forks are skipped: their token cannot write.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - src/client/**
      - src/core/**
      - index.html
      - public/**
      - vite.config.ts
      - e2e/fixtures.ts
      - e2e/receipts/**
      - playwright.receipts.config.ts
      - scripts/receipts-*
      - .github/workflows/receipts.yml
  workflow_dispatch:
    inputs:
      pr:
        description: "number of the open pull request to film"
        type: number
        required: true
# Read only where the PR's code and its dependencies run; write only in the jobs that publish.
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: receipts-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  pr:
    if: github.event.action != 'closed' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      # The base as it is now, not when the PR was opened: "before" is what the PR would land on. A fork's code is never run
      # with this workflow's write token, also not by hand; nor is a closed PR filmed, which nothing would clean up.
      - id: pr
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '"number=\(.number)\nhead=\(.head.sha)\nbase=\(.base.sha)\nrepo=\(.head.repo.full_name)\nstate=\(.state)"' > pr.txt
          cat pr.txt
          grep -qx "repo=$GITHUB_REPOSITORY" pr.txt || { echo "::error::not a pull request from this repository"; exit 1; }
          grep -qx "state=open" pr.txt || { echo "::error::the pull request is not open"; exit 1; }
          cat pr.txt >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}

  film:
    needs: pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.side == 'after' && needs.pr.outputs.head || needs.pr.outputs.base }}
          # No token left behind for the PR's dependencies and tests; the repository is public, so fetching needs none.
          persist-credentials: false
      - name: The PR's tests and tooling over master's app
        if: matrix.side == 'before'
        run: |
          git fetch -q --depth=1 origin "$HEAD_SHA"
          rm -rf e2e
          git checkout FETCH_HEAD -- e2e playwright.config.ts playwright.receipts.config.ts scripts/receipts-gif.sh
        env:
          HEAD_SHA: ${{ needs.pr.outputs.head }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: command -v ffmpeg || sudo apt-get install -y --no-install-recommends ffmpeg
      # A failed test is still filmed up to where it failed and published: the comment says which. The PR's own side fails
      # the job at the end; master's side may fail where the PR adds a receipt for something master does not have.
      - id: film
        continue-on-error: true
        run: pnpm exec playwright test -c playwright.receipts.config.ts
      - run: scripts/receipts-gif.sh receipts-out receipts-gif
      - uses: actions/upload-artifact@v4
        with:
          name: receipts-${{ matrix.side }}
          path: receipts-gif
          if-no-files-found: ignore
          retention-days: 30
      - if: matrix.side == 'after' && steps.film.outcome == 'failure'
        run: echo "::error::a receipt test failed on this PR; see the film step" && exit 1

  publish:
    needs: [pr, film]
    if: ${{ !cancelled() && needs.pr.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.pr.outputs.head }}
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: receipts-*
          path: artifacts
      - name: Receipts in before/ and after/
        run: |
          mkdir -p receipts
          for side in before after; do [ -d "artifacts/receipts-$side" ] && mv "artifacts/receipts-$side" "receipts/$side"; done
          find receipts -type f | sort
          echo "gifs=$(find receipts -name '*.gif' | wc -l)" >> "$GITHUB_OUTPUT"
        id: found
      # A run that filmed nothing (both sides died early) leaves the receipts of the last good run and its comment alone.
      - if: steps.found.outputs.gifs == '0'
        run: echo "::warning::no GIF was produced; the receipts and the comment of the last run stay as they are"
      - if: steps.found.outputs.gifs != '0'
        run: scripts/receipts-publish.sh "$PR" "$HEAD_SHA" receipts
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.pr.outputs.number }}
          HEAD_SHA: ${{ needs.pr.outputs.head }}
      - if: steps.found.outputs.gifs != '0'
        run: node scripts/receipts-comment.mjs receipts
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.pr.outputs.number }}
          HEAD_SHA: ${{ needs.pr.outputs.head }}
          BASE_SHA: ${{ needs.pr.outputs.base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The PR's own scripts: master has them only once this workflow is merged.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: scripts
      - run: scripts/receipts-publish.sh "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - run: node scripts/receipts-comment.mjs --closed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
