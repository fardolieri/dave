name: browser
# Drives the real headless-Chromium scripts (scripts/first-visit.mjs, drive.mjs, drive-share.mjs) against a deployed copy of
# the app: nightly after every master deploy, or any URL by hand. The scripts print what each browser shows; scripts/ci-browser.sh
# turns exceptions, console warnings and unsettled connections into a failed job. Logs and screenshots are kept as an artifact.
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [master]
  # A pull request that touches the scripts or this workflow runs them against nightly, so script changes prove themselves.
  pull_request:
    paths: ['.github/workflows/browser.yml', 'scripts/**']
  workflow_dispatch:
    inputs:
      url:
        description: App to drive
        default: https://dave-nightly.danielmittereder.workers.dev
        required: true
concurrency: browser
jobs:
  chromium:
    # After a deploy, only when it succeeded; a failed deploy leaves nightly on the previous version.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME: /usr/bin/google-chrome
      URL: ${{ inputs.url || 'https://dave-nightly.danielmittereder.workers.dev' }}
    steps:
      - uses: actions/checkout@v5
      # The scripts use only Node built-ins (child_process, fetch, WebSocket), so no pnpm install.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false # nothing is installed; without this the action looks for pnpm and fails
      - run: google-chrome --version
      # The run id keeps each run in rooms of its own.
      - run: scripts/ci-browser.sh "$URL" "ci-${{ github.run_id }}" browser-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ github.run_id }}
          path: browser-out
          retention-days: 14
