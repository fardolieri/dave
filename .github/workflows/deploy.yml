name: deploy
# master deploys the live site (dave). A ruleset on master accepts only a commit whose pull request preview passed the
# whole browser suite (the `preview e2e passed` status, e2e.yml), so what deploys here was tested on real Cloudflare first.
# A bad deploy is undone with rollback.yml.
on:
  push:
    branches: [master]
    # Only a commit that changes what the site is built from: a deploy is a new version for every open tab (its update
    # bar), so a ticket, the docs or a test alone deploys nothing and the live site stays on the last commit that did. Each
    # `!` line leaves files out; scripts/claude/session-start.sh reads them from here to tell master's head is still live.
    paths:
      - '**'
      - '!.scratch/**'
      - '!docs/**'
      - '!**.md'
      - '!.claude/**'
      - '!e2e/**'
      - '!test/**'
concurrency: deploy-master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            TURN_KEY_API_TOKEN
        env:
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
      # The deploy is done when the edge serves this commit's page and files together (ticket 64), not when wrangler returns.
      - name: The live site serves this commit
        run: |
          test -n "$E2E_URL" || { echo "::error::the deploy printed no URL"; exit 1; }
          node scripts/wait-for-deploy.mjs "$GITHUB_SHA"
        env:
          E2E_URL: ${{ steps.deploy.outputs.deployment-url }}
