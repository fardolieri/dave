name: deploy
# master deploys the nightly Worker (dave-nightly); prod deploys the live site (dave).
# Releasing is a fast-forward of prod to master: git push origin master:prod
on:
  push:
    branches: [master, prod]
concurrency: deploy-${{ github.ref_name }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Picks the Wrangler environment when the Vite plugin writes the deploy config; empty means the top-level Worker.
      CLOUDFLARE_ENV: ${{ github.ref_name == 'master' && 'nightly' || '' }}
      # Nightly carries the inspection hooks (src/client/hooks.ts) so the browser suite can run in full against it; prod does not.
      VITE_E2E: ${{ github.ref_name == 'master' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            TURN_KEY_API_TOKEN
        env:
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
