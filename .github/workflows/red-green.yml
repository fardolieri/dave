name: red-green
# The red-then-green receipt (scripts/red-green.mjs): when a branch changes the app and adds or changes tests, those tests run
# against the app from where the branch started, and the job summary says per test whether it fails there. A regression
# test that fails without its fix is the proof that it covers the bug (CLAUDE.md: bug fixes start red).
# The job fails only when the branch has a "Problem report:" commit and its "Regression test:" and "Problem report:"
# commits change no test, or every test they touched ran and passed on the old code; otherwise it is informative. A line
# "No regression test: <reason>" in the fix's body excuses it. Browser tests run in Chromium only, just the touched ones.
# From the Actions tab it can compare with another branch than master. A push to a draft PR's branch skips it (draft-gate.yml).
on:
  push:
    branches-ignore: [master, flake-ledger] # flake-ledger: data only (flakes.yml)
  workflow_dispatch:
    inputs:
      base:
        description: "the branch to compare with (its merge base with this one gives the old app)"
        default: master
        required: true
concurrency:
  group: red-green-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  draft:
    uses: ./.github/workflows/draft-gate.yml
    permissions:
      contents: read
      pull-requests: read
  receipt:
    needs: draft
    if: needs.draft.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The run step has 35 min (inside it: unit tests 8, browser tests 23); the rest is setup and installs.
    timeout-minutes: 60
    # Playwright's own image with both engines in it (Firefox too: a few tests mix the engines in one call), as in e2e.yml,
    # which says why. Pulled even when no browser test runs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      RECEIPT_BASE: origin/${{ inputs.base || 'master' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge base and the branch's commits need the history.
          fetch-depth: 0
          persist-credentials: false
      # The checkout belongs to the runner's user, not root: without this git refuses it, and so does this job's script.
      - run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      # The plan needs only git and the image's Node. pnpm and its cache are set up only when there is something to install:
      # a cache with no store to save after fails the job (2026-10-26, the first run in the image).
      - run: node --test scripts/red-green.test.mjs
      - id: plan
        run: node scripts/red-green.mjs plan
      - if: steps.plan.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.plan.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.plan.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      # Nothing to do while the image matches the checked-out Playwright (e2e.yml says when it does not). A browser missing
      # here would fail every test on the old code too, and read as a red receipt.
      - if: steps.plan.outputs.e2e == 'true'
        run: pnpm exec playwright install chromium firefox
      - if: steps.plan.outputs.run == 'true'
        timeout-minutes: 35
        run: HOME=/root node scripts/red-green.mjs run # root's HOME for Firefox, as in e2e.yml
      - uses: actions/upload-artifact@v4
        # The traces of the browser tests that failed on the old code.
        if: always() && steps.plan.outputs.e2e == 'true'
        with:
          name: red-green-${{ github.run_id }}
          path: e2e-results
          if-no-files-found: ignore
          retention-days: 14
