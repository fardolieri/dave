name: ci
# Typecheck, tests and a build for every pushed branch, which covers pull requests from this repository without a second
# run per push. master gets the same checks from deploy.yml right before deploying, so it is skipped here.
# Runs on GitHub's machines so a small dev box never has to. A push to a draft PR's branch skips it (draft-gate.yml).
# In the Wrangler environment deploy.yml tests and deploys (the top-level Worker): a test that only broke in another
# environment's config once failed a deploy after a green branch.
on:
  push:
    branches-ignore: [master, flake-ledger] # flake-ledger: data only (flakes.yml)
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  draft:
    uses: ./.github/workflows/draft-gate.yml
    permissions:
      contents: read
      pull-requests: read
  check:
    needs: draft
    if: needs.draft.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
